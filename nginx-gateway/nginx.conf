# --- Real IP Restoration from WAF / Upstream Reverse Proxy ---
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80 default_server;
    server_name infohr.vn *.infohr.vn localhost 127.0.0.1;

    client_max_body_size 100M;
    resolver 127.0.0.11 valid=30s;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # --- Static Asset Caching ---
    location /_next/static/ {
        set $upstream_frontend_url http://frontend:80;
        proxy_pass $upstream_frontend_url;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Avatar assets: no-cache to ensure updates are reflected immediately
    location ^~ /assets/images/avatar/ {
        set $upstream_frontend_url http://frontend:80;
        proxy_pass $upstream_frontend_url;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Video streaming for avatars and media: direct Range streaming without browser disk-cache collision
    location ~* \.(?:mp4|webm|ogg)$ {
        set $upstream_frontend_url http://frontend:80;
        proxy_pass $upstream_frontend_url;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_http_version 1.1;
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Accept-Ranges "bytes" always;
    }

    # Static images, icons, fonts from frontend public folder
    location ~* \.(?:ico|gif|jpe?g|png|svg|webp|avif|woff2?|eot|ttf|otf)$ {
        set $upstream_frontend_url http://frontend:80;
        proxy_pass $upstream_frontend_url;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    }

    location /static/ {
        set $upstream_backend_url http://backend:8000;
        proxy_pass $upstream_backend_url;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # MinIO Console API must stay under /minio-console/* to avoid /api/v1 conflicts.
    location /minio-console/api/v1/ {
        resolver 127.0.0.11 valid=30s;
        set $minio_host minio-s3;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix /minio-console/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        rewrite ^/minio-console/api/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://$minio_host:9001;
    }


    location ~* ^/api/(v1/)?auth/(token|convert-token|send-verify-email|forgot-password|reset-password)/ {
        limit_req zone=auth_limit burst=30 nodelay;
        set $upstream_backend_url http://backend:8000;
        proxy_pass $upstream_backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        set $upstream_backend_url http://backend:8000;
        proxy_pass $upstream_backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Compatibility for resumes route -> candidates
    location ~* ^/(?:employer|nha-tuyen-dung)/resumes(?<resumepath>/.*)?$ {
        set $upstream_frontend_url http://frontend:80;
        rewrite ^/(?:employer|nha-tuyen-dung)/resumes(.*)$ /employer/candidates$1 break;
        proxy_pass $upstream_frontend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Talking Head AI Avatar Lipsync Service (preferential prefix ^~ to prevent regex match)
    location ^~ /talking-head/ {
        # Block raw html demo interfaces from being publicly accessed
        location ~* \.(html|htm)$ {
            return 404;
        }

        resolver 127.0.0.11 valid=30s;
        set $upstream_talking_head http://talking-head:8010;
        rewrite ^/talking-head/(.*)$ /$1 break;
        proxy_pass $upstream_talking_head;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        chunked_transfer_encoding off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Accept-Ranges "bytes" always;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        set $upstream_frontend_url http://frontend:80;
        proxy_pass $upstream_frontend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # LiveKit (accept both /livekit and /livekit/)
    location ^~ /livekit {
        resolver 127.0.0.11 valid=30s;
        set $upstream_livekit_url http://livekit:7880;

        rewrite ^/livekit/?(.*)$ /$1 break;
        proxy_pass $upstream_livekit_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /minio/ {
        resolver 127.0.0.11 valid=30s;
        set $minio_host minio-s3;
        rewrite ^/minio/(.*)$ /$1 break;

        proxy_pass http://$minio_host:9000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
    }

    location /minio-console/ {
        resolver 127.0.0.11 valid=30s;
        set $minio_host minio-s3;


        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header X-Forwarded-Prefix /minio-console/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        rewrite ^/minio-console/(.*)$ /$1 break;
        proxy_pass http://$minio_host:9001;
    }
}

server {
    listen 80;
    server_name s3.infohr.vn;
    resolver 127.0.0.11 valid=30s;

    location / {
        set $minio_host minio-s3;
        proxy_pass http://$minio_host:9000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        client_max_body_size 0;
    }

}
