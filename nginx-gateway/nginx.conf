limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name infohr.vn;

    client_max_body_size 100M;
    resolver 127.0.0.11 valid=30s;

    # --- Security Headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://accounts.google.com https://www.google.com https://www.gstatic.com https://www.recaptcha.net https://unpkg.com https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http: https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; media-src 'self' blob: data: https://s3.infohr.vn https://s3.infohr.vn:4433; connect-src 'self' https://s3.infohr.vn https://s3.infohr.vn:4433 wss://infohr.vn https://accounts.google.com https://www.google.com https://www.gstatic.com https://www.recaptcha.net https://firebasestorage.googleapis.com https://*.firebasestorage.app https://firestore.googleapis.com https://*.googleapis.com https://*.goong.io https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net; frame-src 'self' https://accounts.google.com https://www.google.com https://www.recaptcha.net https://s3.infohr.vn https://s3.infohr.vn:4433 https://res.cloudinary.com https://firebasestorage.googleapis.com https://*.firebasestorage.app https://tuyendungsquarevn.firebaseapp.com;" always;

    # --- Static Asset Caching ---
    location /_next/static/ {
        set $upstream_frontend_url http://frontend:80;
        proxy_pass $upstream_frontend_url;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static images, icons, fonts from frontend public folder
    location ~* \.(?:ico|gif|jpe?g|png|svg|webp|avif|woff2?|eot|ttf|otf|mp4|webm)$ {
        set $upstream_frontend_url http://frontend:80;
        proxy_pass $upstream_frontend_url;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    }

    location /static/ {
        set $upstream_backend_url http://backend:8000;
        proxy_pass $upstream_backend_url;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # MinIO Console API must stay under /minio-console/* to avoid /api/v1 conflicts.
    location /minio-console/api/v1/ {
        resolver 127.0.0.11 valid=30s;
        set $minio_host minio-s3;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix /minio-console/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        rewrite ^/minio-console/api/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://$minio_host:9001;
    }


    location ~* ^/api/(v1/)?auth/(token|convert-token|send-verify-email|forgot-password|reset-password)/ {
        limit_req zone=auth_limit burst=30 nodelay;
        set $upstream_backend_url http://backend:8000;
        proxy_pass $upstream_backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        set $upstream_backend_url http://backend:8000;
        proxy_pass $upstream_backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        set $upstream_frontend_url http://frontend:80;
        proxy_pass $upstream_frontend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # LiveKit (accept both /livekit and /livekit/)
    location ^~ /livekit {
        resolver 127.0.0.11 valid=30s;
        set $upstream_livekit_url http://livekit:7880;

        rewrite ^/livekit/?(.*)$ /$1 break;
        proxy_pass $upstream_livekit_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /minio/ {
        resolver 127.0.0.11 valid=30s;
        set $minio_host minio-s3;
        rewrite ^/minio/(.*)$ /$1 break;

        proxy_pass http://$minio_host:9000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
    }

    location /minio-console/ {
        resolver 127.0.0.11 valid=30s;
        set $minio_host minio-s3;


        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header X-Forwarded-Prefix /minio-console/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        rewrite ^/minio-console/(.*)$ /$1 break;
        proxy_pass http://$minio_host:9001;
    }
}

server {
    listen 80;
    server_name s3.infohr.vn;
    resolver 127.0.0.11 valid=30s;

    location / {
        set $minio_host minio-s3;
        proxy_pass http://$minio_host:9000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        client_max_body_size 0;
    }

}
