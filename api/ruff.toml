# Ruff configuration for Backend Django API
target-version = "py311"
line-length = 120

exclude = [
    ".git",
    "__pycache__",
    "**/migrations/*",
    "node_modules",
    "data",
    "logs",
    ".pytest_cache",
    ".ruff_cache",
]

[lint]
# Enforce zero runtime NameError / SyntaxError in production:
# E9:  Runtime syntax errors
# F63: Invalid comparisons / operations
# F7:  Invalid statement structures
# F82: Undefined names (F821, F822, F823)
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
