# =============================================================================
# docker-compose.yml — CONSOLIDATED CONFIGURATION
# =============================================================================
# This file is the single source of truth for all services.
# It is designed to be production-ready by default.
# Use .env for environment-specific settings.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx Gateway
  # ---------------------------------------------------------------------------
  nginx-gateway:
    container_name: tuyendung-studio-nginx-gateway
    build:
      context: ./nginx-gateway
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      livekit:
        condition: service_healthy
      minio:
        condition: service_started
    restart: always
    networks:
      - proxy-net

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    container_name: tuyendung-studio-frontend
    build:
      context: ./frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.prod}
      args:
        NEXT_PUBLIC_NODE_ENV: ${NEXT_PUBLIC_NODE_ENV:-production}
        NEXT_PUBLIC_PROJECT_HOST_NAME: ${NEXT_PUBLIC_PROJECT_HOST_NAME:-infohr.vn}
        NEXT_PUBLIC_ADMIN_PROJECT_HOST_NAME: ${NEXT_PUBLIC_ADMIN_PROJECT_HOST_NAME:-admin.infohr.vn}
        NEXT_PUBLIC_EMPLOYER_PROJECT_HOST_NAME: ${NEXT_PUBLIC_EMPLOYER_PROJECT_HOST_NAME:-employer.infohr.vn}
        NEXT_PUBLIC_PROJECT_SERVER_CLIENT_ID: ${NEXT_PUBLIC_PROJECT_SERVER_CLIENT_ID:-${CLIENT_ID}}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_FACEBOOK_CLIENT_ID: ${NEXT_PUBLIC_FACEBOOK_CLIENT_ID:-}
        NEXT_PUBLIC_GOONGAPI_KEY: ${NEXT_PUBLIC_GOONGAPI_KEY}
        NEXT_PUBLIC_GOONGAPI_ACCESS_TOKEN: ${NEXT_PUBLIC_GOONGAPI_ACCESS_TOKEN:-}
        NEXT_PUBLIC_MINIO_PUBLIC_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_URL:-https://s3.infohr.vn:4433}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-wss://infohr.vn/livekit}
        NEXT_PUBLIC_HRM_PUBLIC_URL: ${NEXT_PUBLIC_HRM_PUBLIC_URL:-https://hrm.infohr.vn}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${NEXT_PUBLIC_FIREBASE_DATABASE_URL}
        NEXT_PUBLIC_FIREBASE_FORCE_LONG_POLLING: ${NEXT_PUBLIC_FIREBASE_FORCE_LONG_POLLING}
    env_file:
      - .env
    expose:
      - "80"
    restart: always
    networks:
      - proxy-net

  # ---------------------------------------------------------------------------
  # Backend (Django)
  # ---------------------------------------------------------------------------
  backend:
    container_name: tuyendung-studio-backend
    shm_size: '2gb'
    build:
      context: ./api
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile.prod}
    command: ${BACKEND_COMMAND:-sh docker-entrypoint.sh gunicorn --bind 0.0.0.0:8000 --workers 3 --worker-class gevent --timeout 120 config.wsgi:application}
    env_file:
      - .env
    volumes:
      - type: bind
        source: ${FPT_GPU_SSH_KEY_SOURCE:-./.secrets/fpt_gpu_ssh_key}
        target: /run/secrets/fpt_gpu_ssh_key
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8000"
    restart: always
    environment:
      - DEBUG=${DEBUG:-False}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-1}
      - AI_TTS_FALLBACK_BASE_URLS=http://vieneu-tts:8298/v1
      - NOTEBOOKLM_MCP_URL=${NOTEBOOKLM_MCP_URL:-http://host.docker.internal:8000/mcp}
      - DEFAULT_NOTEBOOKLM_NOTEBOOK_ID=${DEFAULT_NOTEBOOKLM_NOTEBOOK_ID:-0a469926-b901-426d-afe5-843096613137}
      - INTERVIEW_AGENT_SHARED_SECRET=${INTERVIEW_AGENT_SHARED_SECRET:?Set INTERVIEW_AGENT_SHARED_SECRET in .env and share it with livekit-agent}
      - INTERVIEW_AGENT_AUTH_REQUIRED=${INTERVIEW_AGENT_AUTH_REQUIRED:-True}
      - INTERVIEW_AGENT_AUTH_MAX_SKEW_SECONDS=${INTERVIEW_AGENT_AUTH_MAX_SKEW_SECONDS:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' http://localhost:8000/api/common/health/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - proxy-net
      - app-net
      - data-net

  # ---------------------------------------------------------------------------
  # Migration (run once per deploy)
  # ---------------------------------------------------------------------------
  migrate:
    container_name: tuyendung-studio-migrate
    build:
      context: ./api
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile.prod}
    command: sh docker-entrypoint.sh true
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
      - data-net

  # ---------------------------------------------------------------------------
  # NotebookLM MCP Service
  # ---------------------------------------------------------------------------
  notebooklm-mcp:
    container_name: tuyendung-studio-notebooklm-mcp
    build:
      context: ./notebooklm-mcp
    ports:
      - "8000:8000"
    environment:
      - NOTEBOOKLM_PORT=8000
      - NOTEBOOKLM_HOST=0.0.0.0
      - NOTEBOOKLM_TRANSPORT=http
    volumes:
      - ${APPDATA}/notebooklm-mcp/Data:/root/.local/share/notebooklm-mcp
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app-net
      - proxy-net

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  celery-worker:
    container_name: tuyendung-studio-celery-worker
    build:
      context: ./api
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile.prod}
    command: celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-2} --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1} -Ofair
    env_file:
      - .env
    restart: always
    # Needed only when enabling local Docker/host AI fallback.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
      - data-net

  # ---------------------------------------------------------------------------
  # Celery Beat
  # ---------------------------------------------------------------------------
  celery-beat:
    container_name: tuyendung-studio-celery-beat
    build:
      context: ./api
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile.prod}
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
      - data-net

  # ---------------------------------------------------------------------------
  # MySQL Database
  # ---------------------------------------------------------------------------
  db:
    container_name: tuyendung-studio-db
    image: public.ecr.aws/docker/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-square_db}
    volumes:
      - db_data:/var/lib/mysql
      - ./tuyendungsqstudio.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:?Set DB_PASSWORD in .env}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    networks:
      - data-net

  # ---------------------------------------------------------------------------
  # Database Automated Daily Backup Service (mysqldump + compression + retention)
  # ---------------------------------------------------------------------------
  db-backup:
    container_name: tuyendung-studio-db-backup
    image: public.ecr.aws/docker/library/mysql:8.0
    restart: always
    entrypoint: >
      /bin/sh -c "
      echo '🚀 [DB Backup Service] Initializing Automated Database Daily Backup...';
      while true; do
        DATE=$$(date +%Y-%m-%d_%H%M%S);
        FILE=/backups/db_backup_square_$${DATE}.sql.gz;
        echo \"[$$DATE] 🔄 Executing zero-downtime mysqldump...\";
        mysqldump -h db -u root -p$${MYSQL_ROOT_PASSWORD} --single-transaction --quick --routines --triggers $${MYSQL_DATABASE} | gzip > $$FILE;
        SIZE=$$(du -sh $$FILE 2>/dev/null | cut -f1);
        echo \"[$$DATE] ✅ Daily backup created successfully: $$FILE ($$SIZE)\";
        find /backups -name 'db_backup_*.sql.gz' -mtime +30 -delete 2>/dev/null;
        echo \"[$$DATE] 💤 Next automated backup scheduled in 24 hours.\";
        sleep 86400;
      done
      "
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-square_db}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data-net

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    container_name: tuyendung-studio-redis
    image: public.ecr.aws/docker/library/redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - data-net

  # ---------------------------------------------------------------------------
  # LiveKit Server
  # ---------------------------------------------------------------------------
  livekit:
    container_name: tuyendung-studio-livekit
    image: livekit/livekit-server:latest
    entrypoint: ["/bin/sh", "/usr/local/bin/render-livekit-config.sh"]
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
    volumes:
      - ./voice-ai/docker-livekit-entrypoint.sh:/usr/local/bin/render-livekit-config.sh:ro
    expose:
      - "7880"
      - "7881"
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "50000-50010:50000-50010/udp"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      proxy-net:
        aliases:
          - livekit
      app-net:
        aliases:
          - livekit
      data-net:
        aliases:
          - livekit

  # ---------------------------------------------------------------------------
  # LiveKit Egress (For Recording & S3 Upload)
  # ---------------------------------------------------------------------------
  livekit-egress:
    container_name: tuyendung-studio-livekit-egress
    image: livekit/egress:latest
    restart: always
    cap_add:
      - SYS_ADMIN
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
    entrypoint: ["/bin/sh", "/usr/local/bin/render-egress-config.sh"]
    volumes:
      - ./voice-ai/docker-egress-entrypoint.sh:/usr/local/bin/render-egress-config.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - proxy-net
      - app-net
      - data-net

  # ---------------------------------------------------------------------------
  # Local AI Services are disabled because LLM/STT/TTS run on FPT GPU.
