  #   container_name: tuyendung-studio-whisper
  #   build:
  #     context: ./voice-ai/inference/whisper
  #   profiles: ["local-ai"]
  #   init: true
  #   environment:
  #     - VOXBOX_HF_REPO_ID=${VOXBOX_HF_REPO_ID:-Systran/faster-whisper-large-v3}
  #     - VOXBOX_DEVICE=${VOXBOX_DEVICE:-cpu}
  #     - DATA_DIR=${WHISPER_DATA_DIR:-/data}
  #   volumes:
  #     - whisper-data:/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v1/models > /dev/null"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 20
  #     start_period: 60s
  #   restart: always
  #   networks:
  #     - app-net

  # vieneu-tts:
  #   container_name: tuyendung-studio-tts
  #   build:
  #     context: ./voice-ai/inference/vieneu-text-to-speech
  #   profiles: ["local-ai"]
  #   init: true
  #   env_file:
  #     - .env
  #   environment:
  #     - PORT=${VIENEU_TTS_PORT:-8298}
  #     - TTS_DEVICE=${TTS_DEVICE:-cuda}
  #     - TTS_MODE=${TTS_MODE:-turbo_gpu}
  #   volumes:
  #     - huggingface-cache:/root/.cache/huggingface
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-8298}/health > /dev/null"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 120
  #     start_period: 20m
  #   restart: always
  #   networks:
  #     - app-net

  livekit-agent:
    container_name: tuyendung-studio-livekit-agent
    build:
      context: ./voice-ai/livekit_agent
    env_file:
      - .env
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:8000/api}
      - INTERVIEW_AGENT_SHARED_SECRET=${INTERVIEW_AGENT_SHARED_SECRET:?Set INTERVIEW_AGENT_SHARED_SECRET in .env and share it with backend}
      - LIVEKIT_URL=${LIVEKIT_URL:-http://tuyendung-studio-livekit:7880}
      - LIVEKIT_AGENT_NAME=square-ai-interviewer
      - STT_LANGUAGE=${STT_LANGUAGE:-vi}
      - TTS_VOICE=${TTS_VOICE:-Ly}

    depends_on:
      backend:
        condition: service_started
      livekit:
        condition: service_healthy
    # Needed only when enabling local Docker/host AI fallback.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    restart: always
    networks:
      - app-net
      - data-net

  vieneu-tts:
    container_name: tuyendung-studio-vieneu-tts
    build:
      context: ./voice-ai/inference/vieneu-text-to-speech
    env_file:
      - .env
    environment:
      - PORT=8298
      - TTS_DEVICE=cpu
      - TTS_MODE=turbo
      - TTS_BACKBONE_REPO=pnnbao-ump/VieNeu-TTS-v2-Turbo-GGUF
      - TTS_GGUF_FILENAME=vieneu-tts-v2-turbo.gguf
      - HF_HOME=/models/huggingface
    expose:
      - "8298"
    ports:
      - "8298:8298"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8298/health > /dev/null"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 2m
    networks:
      - app-net

  # ---------------------------------------------------------------------------
  # MinIO (Object Storage)
  # ---------------------------------------------------------------------------
  minio:
    container_name: tuyendung-studio-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --address ":9000" --console-address "${MINIO_CONSOLE_ADDRESS:-:9001}"
    env_file:
      - .env
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      proxy-net:
        aliases:
          - minio
          - minio-s3
      app-net:
        aliases:
          - minio
          - minio-s3

  # ---------------------------------------------------------------------------
  # MinIO Init (set bucket policy — runs once per deploy)
  # ---------------------------------------------------------------------------
  minio-init:
    container_name: tuyendung-studio-minio-init
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      ROOT_USER="$${MINIO_ROOT_USER:-$${MINIO_ACCESS_KEY:-minioadmin}}";
      ROOT_PASS="$${MINIO_ROOT_PASSWORD:-$${MINIO_SECRET_KEY}}";
      mc alias set local http://minio:9000 "$$ROOT_USER" "$$ROOT_PASS";
      mc mb --ignore-existing local/$${MINIO_BUCKET:-square};
      mc anonymous set download local/$${MINIO_BUCKET:-square};
      echo 'MinIO bucket policy set to public download';
      "
    env_file:
      - .env
    restart: "no"
    networks:
      - app-net

  # ---------------------------------------------------------------------------
  # Elasticsearch
  # ---------------------------------------------------------------------------
  elasticsearch:
    container_name: tuyendung-studio-elasticsearch
    image: public.ecr.aws/bitnami/elasticsearch:7.17.18
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: always
    networks:
      - app-net
      - data-net

# =============================================================================
# Networks & Volumes
# =============================================================================
networks:
  proxy-net:
    driver: bridge
  app-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  db_data:
  # Local AI volumes are disabled while using FPT GPU.
  # huggingface-cache:
  # whisper-data:
  minio-data:
  elasticsearch-data:
