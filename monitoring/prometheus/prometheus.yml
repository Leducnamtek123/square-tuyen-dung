# =============================================================================
# InfoHR (Square Tuyển Dụng) — Master Prometheus Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ---------------------------------------------------------------------------
  # 1. Self-Monitoring (Prometheus engine)
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------------------
  # 2. Host OS & Hardware Metrics (CPU, RAM, Disk, Network)
  # ---------------------------------------------------------------------------
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # ---------------------------------------------------------------------------
  # 3. Voice AI WebRTC Media Server (LiveKit SFU)
  # Scrapes active rooms, participants, packet loss, bitrates, audio tracks
  # ---------------------------------------------------------------------------
  - job_name: "livekit"
    metrics_path: /metrics
    static_configs:
      - targets: ["livekit:7889"]
