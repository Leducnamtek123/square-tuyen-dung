# =============================================================================
# InfoHR / Square Tuyển Dụng — WAF Exclusion Rules After CRS
# Rule Set: OWASP ModSecurity Core Rule Set (CRS) v3 / v4
# File: RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
# =============================================================================

# -----------------------------------------------------------------------------
# 1. LOGGING & AUDIT CONFIGURATION
# -----------------------------------------------------------------------------
# Ensure audit log captures relevant request context on 4xx/5xx security blocks
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec/modsec_audit.log
SecAuditLogStorageDir /var/log/modsec/
