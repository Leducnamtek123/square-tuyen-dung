# =============================================================================
# InfoHR / Square Tuyển Dụng — WAF Exclusion Rules Before CRS
# Rule Set: OWASP ModSecurity Core Rule Set (CRS) v3 / v4
# File: REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# =============================================================================

# -----------------------------------------------------------------------------
# 1. LIVEKIT WEBRTC & WEBSOCKET EXCLUSIONS
# -----------------------------------------------------------------------------
# /livekit paths handle real-time WebRTC audio/video signaling and data channels.
# Disable ModSecurity rule engine for these persistent streaming connections
# to prevent latency jitter, false alarms on binary audio frames, or socket drops.
SecRule REQUEST_URI "@beginsWith /livekit" \
    "id:1001001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off"

# -----------------------------------------------------------------------------
# 2. FILE & RESUME UPLOAD EXCLUSIONS (CV, Audio, Video, Avatar)
# -----------------------------------------------------------------------------
# Endpoints receiving multipart/form-data with binary files up to 100MB:
# - /api/v1/files/upload/
# - /api/v1/candidate/resumes/
# - /api/v1/interviews/ (recordings)
# - /minio/ (direct S3 upload)
# We disable SQLi, XSS, and RCE inspection on binary payloads to avoid false positives
# when processing PDF, DOCX, MP4, and WebM content.
SecRule REQUEST_URI "@rx ^/api/(?:v1/)?(?:files/upload|candidate/resumes|interviews/.*/recording)" \
    "id:1002001,\
    phase:2,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920000-920999,\
    ctl:ruleRemoveById=941000-941999,\
    ctl:ruleRemoveById=942000-942999"

SecRule REQUEST_URI "@beginsWith /minio/" \
    "id:1002002,\
    phase:2,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920000-920999,\
    ctl:ruleRemoveById=941000-941999,\
    ctl:ruleRemoveById=942000-942999"

# -----------------------------------------------------------------------------
# 3. VIETNAMESE LANGUAGE & RICH-TEXT HANDLING
# -----------------------------------------------------------------------------
# Job descriptions, candidate CV profiles, and recruiter notes contain Vietnamese
# UTF-8 characters with accents and standard punctuation that could trip strict
# character validation rules (such as 920270 - Invalid character in request).
# Ensure UTF-8 validation is active while allowing multi-byte Vietnamese Unicode.
SecRule &TX:crs_validate_utf8_encoding "@eq 0" \
    "id:1003001,\
    phase:1,\
    pass,\
    nolog,\
    setvar:tx.crs_validate_utf8_encoding=1"

# Relax rule 920270 specifically for rich-text job and CV builder endpoints
SecRule REQUEST_URI "@rx ^/api/(?:v1/)?(?:jobs|candidate|employer|cv-builder)/" \
    "id:1003002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920270"

# -----------------------------------------------------------------------------
# 4. HEALTH CHECK & INTERNAL PROBES
# -----------------------------------------------------------------------------
# Allow Docker and gateway health check endpoints without inspection overhead
SecRule REQUEST_URI "@streq /api/common/health/" \
    "id:1004001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off"
