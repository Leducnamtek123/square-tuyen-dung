# =============================================================================
# docker-compose.override.yml — LOCAL development overrides
# Applied automatically on top of docker-compose.yml.
# Runs frontend/backend from the lightweight dev Dockerfiles.
# =============================================================================

services:
  # Next.js dev server must listen on :80 so the Nginx gateway can proxy to it.
  frontend:
    command: ["pnpm", "exec", "next", "dev", "--webpack", "-p", "80", "-H", "0.0.0.0"]
    restart: unless-stopped

  # Bitnami's public ECR image was retired; use the official Elastic image.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18

  # MinIO deprecated Docker Hub; pull from quay.io instead.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z

  minio-init:
    image: quay.io/minio/mc:latest

  # The stock nginx image entrypoint hangs on `apk manifest nginx`; our config
  # is static (no templates), so run nginx directly and skip the entrypoint.d hooks.
  nginx-gateway:
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./nginx-gateway/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

  # Disable external-IP (STUN) resolution which crash-loops livekit in the VM.
  livekit:
    volumes:
      - ./voice-ai/docker-livekit-entrypoint.local.sh:/usr/local/bin/render-livekit-config.sh:ro
