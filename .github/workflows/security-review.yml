name: Claude Code Security Review

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master, develop]

jobs:
  security-audit:
    name: AI Security Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a6ea32f8b41931 # v5.0.0
        with:
          python-version: '3.11'

      - name: Claude Code Security Review
        uses: anthropics/claude-code-security-review@5cb4481d43a5323cb186bc57d26bb4e019b85c13 # v1
        with:
          comment-pr: true
          upload-results: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          claude-model: 'claude-3-5-sonnet-20241022'
