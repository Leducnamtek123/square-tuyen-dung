name: Backend Quality & Linter Gate

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'api/**'
      - '.github/workflows/backend-lint.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
    paths:
      - 'api/**'
      - '.github/workflows/backend-lint.yml'

permissions:
  contents: read

jobs:
  ruff-lint:
    name: Ruff Static Analysis (Zero NameError & Syntax Guard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@0a5c61591373683505ea898e09a6ea32f8b41931 # v5.0.0
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        working-directory: api
        run: |
          ruff check . --output-format=github
